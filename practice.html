<section>
<h2>اليوم 1: المراجع والعقود</h2>
<ol>
<li><p>مذكرة عن شركة مرخصة في العاصمة تستشهد بمادة من نظام المنطقة الاقتصادية الخاصة. المادة موجودة في البوابة، ونافذة، ونصها كما نقلته المذكرة حرفيًّا. ما الحكم؟</p><ul><li><b>أ.</b> سليم: المادة موجودة ونافذة ومنقولة بدقة</li><li><b>ب.</b> معيب: مرجع مختلق</li><li><b>ج.</b> معيب: اختصاص قضائي خطأ</li><li><b>د.</b> معيب: حكم نظامي ملغى</li></ul></li>
<li><p>مديرك يريد أن يوقّع مع مورّد أجنبي غدًا، ويطلب منك «مذكرة سريعة تطمئننا إلى أن قانون بلد المورّد لا يمنع التعاقد». أي طلب ترسله إلى المساعد؟</p><ul><li><b>أ.</b> ما الذي يفرضه قانون ذلك البلد النافذ اليوم على مورّد مرخص فيه يعالج بيانات عميل أجنبي؟ اذكر القيود أولًا، وقل «لم أجد» حيث لا نص</li><li><b>ب.</b> اكتب مذكرة تطمئننا إلى أن قانون ذلك البلد لا يمنع التعاقد، مع المواد المؤيدة</li><li><b>ج.</b> التوقيع غدًا، فأكّد لي باختصار وبلا تحفظات أن التعاقد جائز</li><li><b>د.</b> اذكر كل الأسباب التي تجعل هذا التعاقد مخالفًا لقانون ذلك البلد</li></ul></li>
<li><p>الدليل في بقاء السرية بعد انتهاء العقد: المفضل خمس سنوات، والبديل الاحتياطي ثلاث، والخط الأحمر أقل من ثلاث. المسودة تقول «ثلاث سنوات». قال المساعد: «خط أحمر، لأنها أقل من الموقف المفضل». ماذا تكتب في قائمة المسائل؟</p><ul><li><b>أ.</b> خط أحمر، ويُرفع إلى المستشارة العامة</li><li><b>ب.</b> مطابق، ولا يحتاج إلى موافقة</li><li><b>ج.</b> بند ناقص، ويُطلب إدراجه</li><li><b>د.</b> بديل احتياطي، ويُقبل بموافقة كبير المستشارين</li></ul></li>
<li><p>أعاد المورّد مسودة من خمس وعشرين صفحة مع رسالة تقول: «التعديلات محدودة، ونوجزها في ست نقاط». الوقت ضيق. بعد قرار التعامل، ما الخطوة الأولى؟</p><ul><li><b>أ.</b> تراجع النقاط الست على الدليل، وتعتمد ما عداها</li><li><b>ب.</b> تقارن المسودتين بأداة المقارنة، ثم تضع الرسالة بجانب النتيجة</li><li><b>ج.</b> تعطي المساعد المسودتين وتسأله عما تغيّر، وتعتمد قائمته</li><li><b>د.</b> تقرأ المسودة الثانية كاملة بعناية من أولها إلى آخرها</li></ul></li>
<li><p>مذكرة كتبها مساعد ذكي لشركة تأمين تستشهد بالمادة 31 من قانون التأمين. فتحتَ النص الموحد في بوابة التشريعات: المادة 31 موجودة، وعليها شريط يقول إنها أُلغيت قبل سنتين وحلت محلها المادة 31 مكررًا بحكم مختلف. أي نمط من أنماط الخطأ هذا؟</p><ul><li><b>أ.</b> مرجع مختلق</li><li><b>ب.</b> اختصاص قضائي خطأ</li><li><b>ج.</b> حكم نظامي ملغى</li><li><b>د.</b> مبدأ قضائي محرَّف</li></ul></li>
<li><p>راجعت متدربة مذكرة فيها سبعة مراجع. فتحت كل مرجع في بوابة التشريعات ووجدت لكل واحد صفحة، وقرأت شريط النفاذ في كل صفحة، وتأكدت أن كل قانون يسري على الموكل. ما الاختبار الذي بقي عليها؟</p><ul><li><b>أ.</b> أن تقارن ما نسبته المذكرة إلى كل مرجع بنصه</li><li><b>ب.</b> أن تسأل المساعد هل هو متأكد من المراجع السبعة</li><li><b>ج.</b> أن تبحث عن كل مرجع في محرك بحث عام</li><li><b>د.</b> أن تتأكد أن أرقام المواد مكتوبة بالصيغة المعتمدة</li></ul></li>
<li><p>يريد مدير العقود رأيًا سريعًا. أمامه أربعة طلبات يكتبها للمساعد عن غرامة التأخير في عقد توريد. أي طلب أقل إملاءً للجواب؟</p><ul><li><b>أ.</b> «أكّد لي بالأسانيد أن غرامة التأخير تسقط إذا قبل المشتري التسليم المتأخر»</li><li><b>ب.</b> «ما الأسانيد التي تدعم سقوط غرامة التأخير بقبول المشتري التسليم المتأخر؟»</li><li><b>ج.</b> «لماذا لا يحق للمشتري أن يطالب بغرامة التأخير بعد قبوله التسليم المتأخر؟»</li><li><b>د.</b> «ما أثر قبول التسليم المتأخر في غرامة التأخير؟ اذكر الرأيين وسند كل منهما»</li></ul></li>
<li><p>في بوابة التشريعات نسخة عربية معتمدة من قانون العمل محدَّثة بتعديل هذا العام، وترجمة إنجليزية كُتب أعلاها «غير رسمية» وتاريخها قبل التعديل. المساعد اقتبس مهلة الإشعار من الترجمة. بماذا تأخذ في مذكرتك؟</p><ul><li><b>أ.</b> بالترجمة، لأن المساعد اقتبس منها نصًّا حرفيًّا</li><li><b>ب.</b> بالنسخة المعتمدة المحدَّثة، وتنبّه إلى الترجمة</li><li><b>ج.</b> بالمهلتين معًا، وتترك الترجيح بينهما لقارئ المذكرة</li><li><b>د.</b> بما يقوله المساعد حين تسأله أي المهلتين أصح</li></ul></li>
<li><p>دليل المواقف في شركة شحن يقول عن مدة السداد: الموقف المفضل 30 يومًا؛ البديل الاحتياطي حتى 45 يومًا بموافقة المدير المالي؛ الخط الأحمر أكثر من 60 يومًا. المسودة تنص على السداد خلال 45 يومًا. كيف تكتب هذا البند في قائمة المسائل؟</p><ul><li><b>أ.</b> مطابق، لأنه لم يبلغ الخط الأحمر</li><li><b>ب.</b> خط أحمر، لأنه ليس الموقف المفضل</li><li><b>ج.</b> بديل احتياطي، ويُحال إلى المدير المالي للموافقة</li><li><b>د.</b> بند ناقص، لأن الدليل لا يذكر 45 يومًا موقفًا مفضلًا</li></ul></li>
<li><p>طلبتَ من المساعد مراجعة مسودة اتفاقية خدمات وفق دليل من عشرة مواقف. أعاد جدولًا من ثمانية صفوف، كل صف فيه رقم بند ونصه. ما أول ما تفحصه في هذا الجدول؟</p><ul><li><b>أ.</b> هل صياغة الصفوف الثمانية سليمة لغويًّا</li><li><b>ب.</b> هل الموقفان اللذان لا صف لهما بندان ناقصان في المسودة</li><li><b>ج.</b> هل رتّب المساعد الصفوف بحسب الخطورة</li><li><b>د.</b> هل يوافق المساعد على الجدول حين تعرضه عليه ثانية</li></ul></li>
<li><p>أرسل الطرف الآخر مسودة ثانية من 30 صفحة مع رسالة تقول: «عدّلنا ثلاثة بنود فقط»، وتسمّيها. الوقت ضيق. أي طريقة تعطيك قائمة التغييرات التي تعتمد عليها؟</p><ul><li><b>أ.</b> تقرأ البنود الثلاثة التي سمّتها الرسالة في المسودتين</li><li><b>ب.</b> تطلب من المساعد أن يقارن المسودتين ويلخص الفروق</li><li><b>ج.</b> تقرأ المسودة الثانية كاملة قراءة سريعة ثم تراجع الرسالة</li><li><b>د.</b> تقارن الملفين بميزة مقارنة المستندات، ثم تطابق الرسالة</li></ul></li>
<li><p>في قائمة المسائل التي كتبها المساعد صف يقول: «البند 12.3: حد المسؤولية مئة في المئة من الرسوم السنوية: خط أحمر». ما الذي تفعله قبل أن يبقى هذا الصف في قائمتك؟</p><ul><li><b>أ.</b> تفتح البند 12.3 في المسودة، وتقارن نصه بالدليل</li><li><b>ب.</b> تبقيه، لأن المساعد ذكر رقم البند ونسبة محددة</li><li><b>ج.</b> تحذفه، لأن المساعد قد يختلق البنود وأرقامها ونسبها</li><li><b>د.</b> تسأل المساعد عن رقم الصفحة التي ورد فيها هذا البند</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الالتزامات والمستندات</h2>
<ol>
<li><p>زميلك راجع مذكرة فيها ثمانية مراجع وقال: «فتحت الثمانية في البوابة، وكل واحد له صفحة، فالمذكرة سليمة». أي عيب من الآتية يكون فحصه قد كشفه حتمًا؟</p><ul><li><b>أ.</b> مادة أُلغيت بقانون لاحق</li><li><b>ب.</b> مادة من نظام لا يسري على الطرف المعني</li><li><b>ج.</b> حكم قضائي نُسب إليه ما لم يقرره</li><li><b>د.</b> حكم قضائي برقم لا وجود له في سجل المحكمة</li></ul></li>
<li><p>أربع فقرات من لائحة افتراضية. أيها التزام يُكتب له صف باسم جهة وفعل ومهلة؟</p><ul><li><b>أ.</b> «على المنشأة أن تبلّغ الهيئة بكل تغيير في عنوانها خلال ثلاثين يومًا»</li><li><b>ب.</b> «المنشأة التي لا تبلّغ تُعد مخالفة وتُسأل عن الضرر»</li><li><b>ج.</b> «يقصد بالعنوان المقر الرئيس المسجل لدى الهيئة»</li><li><b>د.</b> «للهيئة أن تطلب من المنشأة ما يثبت عنوانها»</li></ul></li>
<li><p>كتب المساعد: «المادة 12/2: على المنشأة إبلاغ المتضررين خلال 48 ساعة». فتحتَ النص: الفقرة 1 تلزم المنشأة بإبلاغ الهيئة خلال 48 ساعة، والفقرة 2 تلزمها بإبلاغ المتضررين «دون تأخير». ما الذي تكتبه في عمود الحكم؟</p><ul><li><b>أ.</b> صحيح: الفقرة موجودة والجهة الملزَمة صحيحة</li><li><b>ب.</b> معيب: رقم الفقرة خطأ، والصواب 12/1</li><li><b>ج.</b> معيب: المهلة مستعارة من الفقرة 1، ونص الفقرة 2 «دون تأخير»</li><li><b>د.</b> معيب: بند مختلق لا أساس له في المادة</li></ul></li>
<li><p>رسالة من مديرة الموارد البشرية إلى محامي الشركة الخارجي: «نطلب رأيكم في فصل الموظف (س). مرفق تقريره الطبي عن إجازته المرضية الأخيرة». لم تُرسل إلى أحد غيره. ما التصنيف؟</p><ul><li><b>أ.</b> داخلي، بلا امتياز، وفيه بيانات شخصية</li><li><b>ب.</b> سري، ومشمول بالامتياز، وفيه بيانات شخصية حساسة</li><li><b>ج.</b> سري، ومشمول بالامتياز، ولا بيانات شخصية فيه لأنه مراسلة قانونية</li><li><b>د.</b> سري، وفيه بيانات حساسة، والامتياز سقط بإرفاق تقرير طبي</li></ul></li>
<li><p>كشف رواتب قدّمه الخصم في الدعوى بأمر من المحكمة، وتعهدت شركتك كتابة بألا تستعمله إلا في هذه الدعوى. ليس سريًّا للغاية ولا امتياز فيه. زميلك يريد تلخيصه بالمساعد الداخلي «لأنه على خوادمنا». بحسب بطاقة سنام، ما القرار؟</p><ul><li><b>أ.</b> المساعد الداخلي، كما هو</li><li><b>ب.</b> المساعد الداخلي، بعد ترميز الأسماء</li><li><b>ج.</b> المساعد التجاري المعتمد، بعد الترميز</li><li><b>د.</b> لا أداة، إلا بإذن مكتوب من الخصم أو من المحكمة</li></ul></li>
<li><p>في لائحة للسلامة أربع فقرات. أي فقرة تدخل سجل الالتزامات صفًّا باسم جهة وفعل ومهلة؟</p><ul><li><b>أ.</b> «يقصد بالمنشأة كل موقع عمل فيه عشرة عاملين فأكثر»</li><li><b>ب.</b> «للمفتش أن يدخل المنشأة في أي وقت من أوقات العمل»</li><li><b>ج.</b> «على صاحب المنشأة أن يفحص طفايات الحريق كل ستة أشهر»</li><li><b>د.</b> «تُعد المنشأة التي لا تفحص طفاياتها مخالفة لهذه اللائحة»</li></ul></li>
<li><p>مادة في لائحة تقول في فقرتها الأولى: «يبلّغ المرخص له الهيئة بالحادثة خلال 24 ساعة من علمه بها»، وفي الثانية: «ويبلّغ العملاء المتأثرين دون تأخير غير مبرر». كتب المساعد صفًّا واحدًا: «إبلاغ الهيئة والعملاء خلال 24 ساعة». كيف تصحح السجل؟</p><ul><li><b>أ.</b> تبقي الصف، لأن 24 ساعة هي المهلة الأشد</li><li><b>ب.</b> تكتب صفّين، وكل صف بمهلته كما وردت في فقرته</li><li><b>ج.</b> تبقي الصف وتضيف ملاحظة أن المهلة تقريبية</li><li><b>د.</b> تحذف العملاء من الصف، لأن فقرتهم بلا رقم</li></ul></li>
<li><p>سجل من 20 صفًّا كتبه المساعد من ثلاث مواد. راجعه زميلك صفًّا صفًّا على النص الرسمي ووجد كل صف صحيحًا في رقمه وجهته ومهلته، وقال: «السجل كامل». أي فحص يبقى قبل أن يصح قوله؟</p><ul><li><b>أ.</b> أن يعيد قراءة الصفوف العشرين على النص مرة ثانية</li><li><b>ب.</b> أن يسأل المساعد هل ترك التزامًا في المواد الثلاث</li><li><b>ج.</b> أن يقارن عدد الصفوف بعدد فقرات المواد الثلاث</li><li><b>د.</b> أن يمر على المواد فقرة فقرة ويسأل عن صف كل التزام</li></ul></li>
<li><p>التزام في السجل: «مراجعة صلاحيات الدخول إلى النظام كل ثلاثة أشهر». أي سطر يصلح دليلًا يُعرض على مراجع؟</p><ul><li><b>أ.</b> «مدير تقنية المعلومات يراجع الصلاحيات بانتظام كل ثلاثة أشهر»</li><li><b>ب.</b> «سياسة أمن المعلومات المعتمدة تنص على المراجعة الفصلية»</li><li><b>ج.</b> «محضر المراجعة الفصلية موقَّعًا ومؤرخًا، مع ما أُلغي فيها»</li><li><b>د.</b> «النظام يتيح تقريرًا كاملًا بالصلاحيات في أي وقت عند الطلب»</li></ul></li>
<li><p>مستند في ملف دعوى عمالية: رسالة من مدير الفرع إلى محامي الشركة يسأله عن جواز خصم من راتب موظف مسمّى، ولم تُرسل إلى غيره. كيف تصنفه بالأسئلة الثلاثة؟</p><ul><li><b>أ.</b> داخلي، بلا امتياز، وبلا بيانات شخصية</li><li><b>ب.</b> سري، ومشمول بالامتياز، وفيه بيانات شخصية</li><li><b>ج.</b> سري للغاية، وبلا امتياز، وفيه بيانات حساسة</li><li><b>د.</b> عام، ومشمول بالامتياز، وبلا بيانات شخصية</li></ul></li>
<li><p>في جهتك ثلاث أدوات: مساعد على خوادمها، ومساعد تجاري معتمد بعقد، ومساعد عام مجاني. البطاقة تقول: المشمول بالامتياز لا يتجاوز المساعد الداخلي، والبيانات الشخصية تُرمَّز قبل أي أداة. أمامك مذكرة من المحامي فيها أسماء ثلاثة شهود. ما القرار؟</p><ul><li><b>أ.</b> المساعد التجاري المعتمد بعد ترميز الأسماء</li><li><b>ب.</b> المساعد الداخلي كما هي</li><li><b>ج.</b> المساعد العام بعد ترميز الأسماء</li><li><b>د.</b> المساعد الداخلي بعد ترميز الأسماء</li></ul></li>
<li><p>رمّزت زميلتك تقرير إصابة عمل: وضعت رمزًا مكان اسم المصاب ورقم هويته، وأبقت التشخيص وتاريخ الحادث واسم المستشفى. تقول: «صار التقرير بلا بيانات شخصية، فيدخل أي أداة». ما تقييمك؟</p><ul><li><b>أ.</b> التقرير ما زال بيانات صحية عن شخص يمكن معرفته</li><li><b>ب.</b> كلامها صحيح، لأن الاسم ورقم الهوية حُذفا من التقرير</li><li><b>ج.</b> كلامها صحيح بشرط أن تحذف جدول المفاتيح بعد الترميز</li><li><b>د.</b> التقرير صار عامًّا، لأن الرموز لا تدل على أحد</li></ul></li>
<li><p>لخّصتَ ثلاثة مستندات من ملف نزاع بالمساعد الداخلي، ولم يدخل مستندان آخران أي أداة لأنهما سريان للغاية. تكتب سطر الإفصاح في مذكرة الملف. أي صياغة تؤدي الغرض؟</p><ul><li><b>أ.</b> «استُعين بأدوات ذكاء اصطناعي معتمدة في إعداد ملخصات هذه المذكرة، وروجعت قبل اعتمادها»</li><li><b>ب.</b> «أعد المساعد الداخلي ملخصات المستندات 1 و2 و3، وهو المسؤول عن دقتها، ولم يدخل غيرها»</li><li><b>ج.</b> «لُخّصت المستندات 1 و2 و3 بالمساعد الداخلي، ولم يدخل 4 و5 أي أداة، وراجعتُها وأنا المسؤول»</li><li><b>د.</b> «لم يُستعمل أي ذكاء اصطناعي في المستندين السريين للغاية 4 و5، التزامًا ببطاقة التعامل»</li></ul></li>
</ol>

<section>
<h2>المشروع الختامي: بطاقة إعادة التصميم والمراجعة المباشرة</h2>
<ol>
<li><p>خط الأساس: 31 دقيقة، وفاته عيب. التنفيذ الأول بالمساعد: 14 دقيقة، وفاته عيبان. الثاني، بعد طلب النص المقتبس مع كل حكم: 19 دقيقة، ولم يفته شيء. أي استنتاج تسنده الأسطر؟</p><ul><li><b>أ.</b> التنفيذ الأول هو الأفضل لأنه الأسرع، فيُعتمد</li><li><b>ب.</b> مع التعديل صار أسرع دون عيب فائت في هذه النماذج؛ ويُعاد القياس قبل التعميم</li><li><b>ج.</b> المساعد يخفض وقت التحقق من المراجع بنحو 40% لكل من يستعمله</li><li><b>د.</b> المساعد لا يصلح لهذه المهمة، لأن التنفيذ الأول فوّت عيبين</li></ul></li>
<li><p>سجل قياس لمراجعة اتفاقيات قصيرة. خط الأساس دون مساعد: 34 دقيقة وعيب واحد فائت. التنفيذ بالمساعد: 12 دقيقة لإخراج القائمة، ثم 15 دقيقة للتحقق منها، وعيبان فائتان. ماذا يقول هذا السجل؟</p><ul><li><b>أ.</b> المساعد وفّر 22 دقيقة</li><li><b>ب.</b> المساعد وفّر 7 دقائق وزاد الفائت عيبًا</li><li><b>ج.</b> المساعد أبطأ من العمل باليد</li><li><b>د.</b> لا يقول شيئًا، لأن النموذجين مختلفان</li></ul></li>
<li><p>بعد التنفيذ الأول يريد مشارك أن يغيّر في التنفيذ الثاني ثلاثة أشياء معًا: يقرأ بيده أولًا، ويغيّر نص طلبه، ويغيّر الأداة. تحسن قياسه. ما الذي يستطيع أن يكتبه في بطاقته؟</p><ul><li><b>أ.</b> أن الأداة الجديدة أفضل من الأولى في هذه المهمة وأمثالها</li><li><b>ب.</b> أن القراءة باليد قبل سؤال المساعد هي سبب هذا التحسن</li><li><b>ج.</b> أن نص الطلب الجديد هو سبب التحسن بين التنفيذين</li><li><b>د.</b> أن الطريقة الجديدة قيست أفضل، ولا يُعرف أي تغيير نفع</li></ul></li>
<li><p>تكتب مستشارة بطاقة إعادة تصميم لمهمة «الرد على استفسارات الإدارات عن مهل الإشعار النظامية». أي سطر يصلح قاعدة توقف؟</p><ul><li><b>أ.</b> «إذا ذكر المساعد مادة لا أجدها برقمها في النص، أكتب الرد بيدي»</li><li><b>ب.</b> «أراجع جواب المساعد بعناية كاملة قبل إرساله إلى الإدارة التي سألت»</li><li><b>ج.</b> «أستعمل المساعد في الاستفسارات السهلة فقط، وأجيب عن الصعبة بيدي»</li><li><b>د.</b> «أطلب من المساعد أن ينبهني في أول جوابه إذا لم يكن متأكدًا من المهلة»</li></ul></li>
</ol>

ر.","misconceptions":["يأخذ برواية الطرف الآخر عما غيّره","يعتمد على ملخص قد يفوته حذف أو يضيف تغييرًا لم يقع","يعتمد على الذاكرة في 30 صفحة: الحذف لا يُرى بالقراءة",""],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"why-independent-compare","title":"ثلاثة مصادر تخبرك بما تغيّر، وواحد منها فقط لا ينسى"},"level":"evaluate","pool":"practice"},{"id":"q-playbook-04","type":"single","prompt":"في قائمة المسائل التي كتبها المساعد صف يقول: «البند 12.3: حد المسؤولية مئة في المئة من الرسوم السنوية: خط أحمر». ما الذي تفعله قبل أن يبقى هذا الصف في قائمتك؟","options":[{"key":"أ","text":"تفتح البند 12.3 في المسودة، وتقارن نصه بالدليل"},{"key":"ب","text":"تبقيه، لأن المساعد ذكر رقم البند ونسبة محددة"},{"key":"ج","text":"تحذفه، لأن المساعد قد يختلق البنود وأرقامها ونسبها"},{"key":"د","text":"تسأل المساعد عن رقم الصفحة التي ورد فيها هذا البند"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"كل مسألة تُفحص في المسودة: هل البند بهذا الرقم، وهل نصه كما نُقل، وهل النتيجة ما يقوله الدليل. الرقم والنسبة قد يكونان خطأ.","misconceptions":["","يعد التفصيل دليل صحة: رقم البند قد يكون من مسودة أخرى أو مختلقًا","يرد كل ما كتبه المساعد دون فحص: قد يكون الصف صحيحًا ومهمًّا","يستبدل سؤال المساعد بفتح المسودة"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"verify-the-list","title":"ثلاثة فحوص لكل مسألة، وسؤال واحد معاكس"},"level":"apply","pool":"practice"},{"id":"q-register-01","type":"single","prompt":"في لائحة للسلامة أربع فقرات. أي فقرة تدخل سجل الالتزامات صفًّا باسم جهة وفعل ومهلة؟","options":[{"key":"أ","text":"«يقصد بالمنشأة كل موقع عمل فيه عشرة عاملين فأكثر»"},{"key":"ب","text":"«للمفتش أن يدخل المنشأة في أي وقت من أوقات العمل»"},{"key":"ج","text":"«على صاحب المنشأة أن يفحص طفايات الحريق كل ستة أشهر»"},{"key":"د","text":"«تُعد المنشأة التي لا تفحص طفاياتها مخالفة لهذه اللائحة»"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"الفقرة الثالثة وحدها فيها جهة ملزَمة وفعل وموعد. الباقي تعريف، وصلاحية لجهة عامة، وأثر يترتب على المخالفة.","misconceptions":["يعد التعريف التزامًا","يعد صلاحية المفتش التزامًا على المنشأة","","يعد الأثر التزامًا: الفقرة تقول ما يترتب على المخالفة ولا تأمر بفعل"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"not-every-paragraph","title":"خمسة أنواع من الفقرات، وواحد منها فقط يدخل السجل صفًّا"},"level":"analyze","pool":"practice"},{"id":"q-register-02","type":"single","prompt":"مادة في لائحة تقول في فقرتها الأولى: «يبلّغ المرخص له الهيئة بالحادثة خلال 24 ساعة من علمه بها»، وفي الثانية: «ويبلّغ العملاء المتأثرين دون تأخير غير مبرر». كتب المساعد صفًّا واحدًا: «إبلاغ الهيئة والعملاء خلال 24 ساعة». كيف تصحح السجل؟","options":[{"key":"أ","text":"تبقي الصف، لأن 24 ساعة هي المهلة الأشد"},{"key":"ب","text":"تكتب صفّين، وكل صف بمهلته كما وردت في فقرته"},{"key":"ج","text":"تبقي الصف وتضيف ملاحظة أن المهلة تقريبية"},{"key":"د","text":"تحذف العملاء من الصف، لأن فقرتهم بلا رقم"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"التزامان لجهتين مخاطَبتين بمهلتين مختلفتين: صفّان، والمهلة تُنقل من فقرتها بلفظها. نقل 24 ساعة إلى الفقرة الثانية مهلة مستعارة.","misconceptions":["يظن أن الأشد أسلم: السجل ينسب إلى النص ما لم يقله","","يعالج الخطأ بملاحظة ويبقي المهلة المستعارة","يسقط التزامًا لأن مهلته بلا رقم"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"split-and-keep-deadlines","title":"صف لكل ثلاثية: جهة وفعل ومهلة. والمهلة تبقى في فقرتها"},"level":"apply","pool":"practice"},{"id":"q-register-03","type":"single","prompt":"سجل من 20 صفًّا كتبه المساعد من ثلاث مواد. راجعه زميلك صفًّا صفًّا على النص الرسمي ووجد كل صف صحيحًا في رقمه وجهته ومهلته، وقال: «السجل كامل». أي فحص يبقى قبل أن يصح قوله؟","options":[{"key":"أ","text":"أن يعيد قراءة الصفوف العشرين على النص مرة ثانية"},{"key":"ب","text":"أن يسأل المساعد هل ترك التزامًا في المواد الثلاث"},{"key":"ج","text":"أن يقارن عدد الصفوف بعدد فقرات المواد الثلاث"},{"key":"د","text":"أن يمر على المواد فقرة فقرة ويسأل عن صف كل التزام"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المراجعة من السجل إلى النص تثبت صحة الموجود. الغائب يظهر بالاتجاه المعاكس فقط: المرور على النص فقرة فقرة والسؤال عن صف كل التزام.","misconceptions":["يكرر الاتجاه نفسه، من السجل إلى النص: الغائب لا صف له ليُقرأ","يوكل كشف الغياب إلى من غاب عنه: المساعد يقول إنه راجع كل شيء","يعد العدد دليل اكتمال: فقرة قد تحمل التزامين، وفقرة لا تحمل شيئًا",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"verify-each-entry","title":"أربعة أسئلة لكل صف، والنص الرسمي مفتوح بجانبه"},"level":"evaluate","pool":"practice"},{"id":"q-register-04","type":"single","prompt":"التزام في السجل: «مراجعة صلاحيات الدخول إلى النظام كل ثلاثة أشهر». أي سطر يصلح دليلًا يُعرض على مراجع؟","options":[{"key":"أ","text":"«مدير تقنية المعلومات يراجع الصلاحيات بانتظام كل ثلاثة أشهر»"},{"key":"ب","text":"«سياسة أمن المعلومات المعتمدة تنص على المراجعة الفصلية»"},{"key":"ج","text":"«محضر المراجعة الفصلية موقَّعًا ومؤرخًا، مع ما أُلغي فيها»"},{"key":"د","text":"«النظام يتيح تقريرًا كاملًا بالصلاحيات في أي وقت عند الطلب»"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"الدليل شيء له تاريخ يثبت أن الضابط نُفّذ. الأول مسؤول، والثاني ضابط مكتوب، والرابع إمكانية لا تثبت أن المراجعة جرت.","misconceptions":["يسمّي المسؤول ويعد قوله دليلًا","يعد وجود السياسة دليلًا على تنفيذها","","يعد إمكانية استخراج تقرير دليلًا على أن المراجعة جرت"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"owner-control-evidence","title":"المسؤول ينفذ، والضابط يضمن، والدليل يثبت"},"level":"apply","pool":"practice"},{"id":"q-handling-01","type":"single","prompt":"مستند في ملف دعوى عمالية: رسالة من مدير الفرع إلى محامي الشركة يسأله عن جواز خصم من راتب موظف مسمّى، ولم تُرسل إلى غيره. كيف تصنفه بالأسئلة الثلاثة؟","options":[{"key":"أ","text":"داخلي، بلا امتياز، وبلا بيانات شخصية"},{"key":"ب","text":"سري، ومشمول بالامتياز، وفيه بيانات شخصية"},{"key":"ج","text":"سري للغاية، وبلا امتياز، وفيه بيانات حساسة"},{"key":"د","text":"عام، ومشمول بالامتياز، وبلا بيانات شخصية"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"طلب مشورة من المحامي لم يخرج عن دائرته، وفيه اسم موظف وراتبه. الراتب بيانات شخصية وليس من الفئات الحساسة.","misconceptions":["يرى مراسلة داخلية ولا يرى طلب المشورة ولا اسم الموظف","","يرفع كل ما في الدعوى إلى أعلى مستوى ويعد الراتب بيانات حساسة","يعد المستند عامًّا وهو مراسلة لم تُنشر"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"three-questions","title":"ثلاثة أسئلة عن كل مستند، وكل سؤال له علامات في المستند نفسه"},"level":"analyze","pool":"practice"},{"id":"q-handling-02","type":"single","prompt":"في جهتك ثلاث أدوات: مساعد على خوادمها، ومساعد تجاري معتمد بعقد، ومساعد عام مجاني. البطاقة تقول: المشمول بالامتياز لا يتجاوز المساعد الداخلي، والبيانات الشخصية تُرمَّز قبل أي أداة. أمامك مذكرة من المحامي فيها أسماء ثلاثة شهود. ما القرار؟","options":[{"key":"أ","text":"المساعد التجاري المعتمد بعد ترميز الأسماء"},{"key":"ب","text":"المساعد الداخلي كما هي"},{"key":"ج","text":"المساعد العام بعد ترميز الأسماء"},{"key":"د","text":"المساعد الداخلي بعد ترميز الأسماء"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"قاعدتان تنطبقان، ويُعمل بهما معًا: الامتياز يضع السقف عند المساعد الداخلي، والبيانات الشخصية توجب الترميز قبله.","misconceptions":["يظن أن الترميز يرفع قيد الامتياز","يطبق قاعدة الامتياز وينسى قاعدة البيانات الشخصية","يظن أن الترميز يجعل المستند صالحًا لأي أداة",""],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"most-restrictive-wins","title":"كل جواب يضع سقفًا، ويُعمل بأدنى السقوف"},"level":"apply","pool":"practice"},{"id":"q-handling-03","type":"single","prompt":"رمّزت زميلتك تقرير إصابة عمل: وضعت رمزًا مكان اسم المصاب ورقم هويته، وأبقت التشخيص وتاريخ الحادث واسم المستشفى. تقول: «صار التقرير بلا بيانات شخصية، فيدخل أي أداة». ما تقييمك؟","options":[{"key":"أ","text":"التقرير ما زال بيانات صحية عن شخص يمكن معرفته"},{"key":"ب","text":"كلامها صحيح، لأن الاسم ورقم الهوية حُذفا من التقرير"},{"key":"ج","text":"كلامها صحيح بشرط أن تحذف جدول المفاتيح بعد الترميز"},{"key":"د","text":"التقرير صار عامًّا، لأن الرموز لا تدل على أحد"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الترميز يخفي من هو، ولا يغيّر ما في التقرير. التشخيص باقٍ، والتاريخ والمستشفى قد يدلان على صاحبه، ومن يملك الجدول يعرفه: يبقى حساسًا.","misconceptions":["","يعد الاسم ورقم الهوية المعرِّفين الوحيدين","يظن أن حذف الجدول يكفي: التاريخ والمستشفى والتشخيص تدل على صاحبه","يخلط الترميز بالنشر"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"pseudonymise-or-redact","title":"الترميز يخفي من هو، والحجب يزيل ما لا تحتاج إليه المهمة"},"level":"evaluate","pool":"practice"},{"id":"q-handling-04","type":"single","prompt":"لخّصتَ ثلاثة مستندات من ملف نزاع بالمساعد الداخلي، ولم يدخل مستندان آخران أي أداة لأنهما سريان للغاية. تكتب سطر الإفصاح في مذكرة الملف. أي صياغة تؤدي الغرض؟","options":[{"key":"أ","text":"«استُعين بأدوات ذكاء اصطناعي معتمدة في إعداد ملخصات هذه المذكرة، وروجعت قبل اعتمادها»"},{"key":"ب","text":"«أعد المساعد الداخلي ملخصات المستندات 1 و2 و3، وهو المسؤول عن دقتها، ولم يدخل غيرها»"},{"key":"ج","text":"«لُخّصت المستندات 1 و2 و3 بالمساعد الداخلي، ولم يدخل 4 و5 أي أداة، وراجعتُها وأنا المسؤول»"},{"key":"د","text":"«لم يُستعمل أي ذكاء اصطناعي في المستندين السريين للغاية 4 و5، التزامًا ببطاقة التعامل»"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"سطر الإفصاح يقول ثلاثة أشياء: ما دخل أي أداة، وما لم يدخل، ومن راجع وهو المسؤول. المساءلة على المحامي لا على الأداة.","misconceptions":["إفصاح عام لا يقول أي مستند دخل أي أداة ولا من المسؤول","ينقل المسؤولية إلى الأداة","","يذكر ما لم يدخل ويسكت عما دخل ومن راجعه"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"disclosing-ai-use","title":"للعميل وللمحكمة: ما الذي فعله المساعد، وما الذي راجعته، ومن المسؤول"},"level":"apply","pool":"practice"},{"id":"q-redesign-01","type":"single","prompt":"سجل قياس لمراجعة اتفاقيات قصيرة. خط الأساس دون مساعد: 34 دقيقة وعيب واحد فائت. التنفيذ بالمساعد: 12 دقيقة لإخراج القائمة، ثم 15 دقيقة للتحقق منها، وعيبان فائتان. ماذا يقول هذا السجل؟","options":[{"key":"أ","text":"المساعد وفّر 22 دقيقة"},{"key":"ب","text":"المساعد وفّر 7 دقائق وزاد الفائت عيبًا"},{"key":"ج","text":"المساعد أبطأ من العمل باليد"},{"key":"د","text":"لا يقول شيئًا، لأن النموذجين مختلفان"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الدقائق تشمل التحقق: 12 + 15 = 27 دقيقة مقابل 34. والأخطاء تُقرأ مع الوقت: الفائت زاد من واحد إلى اثنين.","misconceptions":["يحسب وقت الإخراج وينسى وقت التحقق","","يجمع الوقتين خطأ: 27 دقيقة أقل من 34","يرد القياس كله: النماذج متكافئة، والسجل يقول شيئًا محدودًا"],"lo":["LO5"],"day":3,"session":null,"slide":{"deck":"capstone","id":"what-you-measure","title":"ثلاثة أسطر في سجل واحد: الدقائق، والفائت، والمعلَّم خطأً"},"level":"analyze","pool":"practice"},{"id":"q-redesign-02","type":"single","prompt":"بعد التنفيذ الأول يريد مشارك أن يغيّر في التنفيذ الثاني ثلاثة أشياء معًا: يقرأ بيده أولًا، ويغيّر نص طلبه، ويغيّر الأداة. تحسن قياسه. ما الذي يستطيع أن يكتبه في بطاقته؟","options":[{"key":"أ","text":"أن الأداة الجديدة أفضل من الأولى في هذه المهمة وأمثالها"},{"key":"ب","text":"أن القراءة باليد قبل سؤال المساعد هي سبب هذا التحسن"},{"key":"ج","text":"أن نص الطلب الجديد هو سبب التحسن بين التنفيذين"},{"key":"د","text":"أن الطريقة الجديدة قيست أفضل، ولا يُعرف أي تغيير نفع"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"ثلاثة تغييرات معًا لا تفصل أثر أحدها. الاستنتاج الصادق عن المجموع، ولذلك يطلب المشروع تعديلًا واحدًا بين التنفيذين.","misconceptions":["ينسب التحسن إلى الأداة لأنها أظهر التغييرات: التغييران الآخران وقعا معها","ينسب التحسن إلى ما يتوقعه من قبل: القياس لا يفصل القراءة باليد عن غيرها","يعد آخر ما عدّله في الطلب هو السبب: لا تنفيذ يختلف فيه نص الطلب وحده",""],"lo":["LO5"],"day":3,"session":null,"slide":{"deck":"capstone","id":"run-2","title":"غيّر شيئًا واحدًا، ثم قِس ثانية"},"level":"evaluate","pool":"practice"},{"id":"q-redesign-03","type":"single","prompt":"تكتب مستشارة بطاقة إعادة تصميم لمهمة «الرد على استفسارات الإدارات عن مهل الإشعار النظامية». أي سطر يصلح قاعدة توقف؟","options":[{"key":"أ","text":"«إذا ذكر المساعد مادة لا أجدها برقمها في النص، أكتب الرد بيدي»"},{"key":"ب","text":"«أراجع جواب المساعد بعناية كاملة قبل إرساله إلى الإدارة التي سألت»"},{"key":"ج","text":"«أستعمل المساعد في الاستفسارات السهلة فقط، وأجيب عن الصعبة بيدي»"},{"key":"د","text":"«أطلب من المساعد أن ينبهني في أول جوابه إذا لم يكن متأكدًا من المهلة»"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"قاعدة التوقف تسمّي علامة تُرى وفعلًا يتبعها. «بعناية» و«السهلة» لا تُقاسان، والمساعد لا يُعتمد عليه في الإنذار بأخطائه.","misconceptions":["","نية لا علامة فيها ولا فعل محدد","معيار لا يُعرف قبل قراءة الاستفسار، ولا يقول متى يُترك المساعد","يوكل الإنذار إلى المساعد نفسه"],"lo":["LO5"],"day":3,"session":null,"slide":{"deck":"capstone","id":"redesign-card","title":"صفحة واحدة عن مهمتك أنت، تدافع عنها"},"level":"apply","pool":"practice"}]}</script>
